name: Update Manifests

on:
  push:
    branches:
      - main
    paths:
      - '6Max Chart/6-Max Rangek/**/*.png'
      - 'generate-manifest.js'
  workflow_dispatch:

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate manifests
        run: node generate-manifest.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code 6Max\ Chart/manifest.json 6Max\ Chart/manifest.js || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "6Max Chart/manifest.json" "6Max Chart/manifest.js"
          git commit -m "chore: auto-update manifests [skip ci]"
          git push
