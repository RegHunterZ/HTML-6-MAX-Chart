name: Build Manifest

on:
  push:
    branches:
      - main
      - copilot/**
    paths:
      - '6Max Chart/6-Max Rangek/**/*.png'
      - 'scripts/build-manifest.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Build manifest files
        run: node scripts/build-manifest.js
        
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet '6Max Chart/manifest.json' '6Max Chart/manifest.js'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add '6Max Chart/manifest.json' '6Max Chart/manifest.js'
          git commit -m 'Auto-generate manifest.json and manifest.js'
          git push
